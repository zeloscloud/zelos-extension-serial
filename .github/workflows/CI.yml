name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  # Not github.workflow: when Release calls this, that is "Release", and the run would wait on itself.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One failing OS must not hide the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Agent runtime: uv installs the Python version pinned in .python-version.
      - uses: astral-sh/setup-uv@v10.2.0
        if: hashFiles('pyproject.toml') != ''
        with:
          enable-cache: true

      # Web project (tab and panels)
      - uses: actions/setup-node@v7
        if: hashFiles('web/package.json') != ''
        with:
          node-version-file: web/.nvmrc

      - uses: extractions/setup-just@v4

      # A stale lock would ship in the package and fail to install on other platforms.
      - name: Verify uv.lock is in sync with pyproject.toml
        if: hashFiles('uv.lock') != ''
        run: uv lock --locked

      - name: Install dependencies
        run: just ci-install

      - name: Check formatting, lint and type-check
        run: just check

      - name: Run tests
        run: just test

      - name: Build web project
        if: hashFiles('web/package.json') != ''
        run: just build

      # Linux only: the measurements need a pseudo-terminal and a quiet runner to mean anything.
      - name: Throughput with zero loss
        if: runner.os == 'Linux'
        run: uv run pytest -m perf
