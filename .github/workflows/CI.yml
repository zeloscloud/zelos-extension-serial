name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Not github.workflow: when Release calls this, that is "Release", and the run would wait on itself.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One failing OS must not hide the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Agent runtime: uv installs the Python version pinned in .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        if: hashFiles('pyproject.toml') != ''
        with:
          enable-cache: true

      # Web project (tab and panels)
      - uses: actions/setup-node@v7
        if: hashFiles('web/package.json') != ''
        with:
          node-version-file: web/.nvmrc

      - uses: extractions/setup-just@v4

      # The release packages on Linux, so CI installs the CLI and packages there.
      - name: Install Zelos CLI
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://release.zeloscloud.io/cli/install.sh | bash
          echo "$HOME/.zelos/bin" >> "$GITHUB_PATH"
        env:
          INSTALLER_NO_MODIFY_PATH: 1

      - name: Install dependencies
        run: just ci-install

      - name: Check formatting and lint, and type-check the web project
        run: just check

      - name: Run tests
        run: just test

      - name: Build and package extension
        if: runner.os == 'Linux'
        run: just package

      # Linux only: the measurements need a pseudo-terminal and a quiet runner to mean anything.
      - name: Throughput with zero loss
        if: runner.os == 'Linux'
        run: uv run pytest -m perf
