name = "Serial"
version = "0.4.1"
description = "Record device consoles over UART, USB serial, TCP or RFC 2217: every line becomes a log event with its level and module, and every printed value a signal."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-serial"
# The marketplace search and Zelos AI find an extension by these words, its name and its description.
keywords = ["serial", "uart", "usb serial", "serial port", "com port", "tty", "console", "terminal", "log", "plotter", "rs232", "rs485", "rfc2217", "ser2net", "zephyr", "esp32", "esp-idf", "arduino", "stm32", "teleplot"]
categories = ["Embedded", "Diagnostics", "IoT", "Industrial"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

# Workers stop within 100 ms and the app's flush waits at most 1 s; the rest is the SDK's atexit drain.
[agent.stop]
grace_seconds = 5

[package]
# assets/readme: an installed copy shows the README's pictures from the package, not from GitHub.
paths = ["main.py", "zelos_extension_serial", "LICENSE", "assets/readme"]
